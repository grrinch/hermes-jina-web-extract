[project]
name = "hermes-jina-web-extract"
version = "0.1.0"
description = "Standalone Hermes Agent Jina Reader provider for web_extract."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [
  { name = "Rad Paluszak", email = "" },
  { name = "NON.agency" },
]
keywords = ["hermes-agent", "plugin", "jina", "web-extract", "reader"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "httpx>=0.24",
]

[project.urls]
Homepage = "https://paluszak.me/"
Organization = "https://non.agency/"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]
